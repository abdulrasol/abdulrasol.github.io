  <style>
    :root {
      --primary: #143044;
      --bg: #F7F9FC; --surface: #FFFFFF; --text: #0B0F1F;
      --muted: #5B6476; --border: #E3E8F0; --chip: #F7F9FC; --icon-bg: #EAEFF6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0B0F1F; --surface: #121829; --text: #F8FAFC;
              --muted: #94A3B8; --border: rgba(255, 255, 255, 0.08);
              --chip: rgba(255, 255, 255, 0.03); --icon-bg: rgba(255, 255, 255, 0.07); }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text); text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    .card {
      width: 100%; max-width: 400px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px;
    }
    .logo { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 22px; }
    .stores { display: grid; gap: 10px; }
    .btn {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 18px; border-radius: 14px; text-align: start;
      background: var(--chip); border: 1px solid var(--border);
      color: var(--text); text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--primary); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .icon {
      flex: none; width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center; background: var(--icon-bg);
    }
    .icon svg { width: 22px; height: 22px; }
    .label { display: flex; flex-direction: column; line-height: 1.25; }
    .label small { font-size: 12px; color: var(--muted); font-weight: 500; }
    .label strong { font-size: 17px; font-weight: 700; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #0B0F1F; }
    .btn.primary .icon { background: rgba(11, 15, 31, 0.12); }
    .btn.primary .label small { color: rgba(11, 15, 31, 0.7); }
    .back { display: inline-block; margin-top: 20px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/baytraq/logo.png" alt="Baytraq" width="72" height="72">
    <h1>Baytraq</h1>
    <p id="status">Taking you to the right store for your device…</p>

    <div class="stores">
      <a class="btn" id="btn-android" href="https://play.google.com/store/apps/details?id=io.github.abdulrasol.baytraqsalesmanager" data-goatcounter-click="download-android-baytraq">
        <span class="icon" aria-hidden="true">

        </span>
        <span class="label"><small>Android</small><strong>Google Play</strong></span>
      </a>
      <a class="btn" id="btn-desktop" href="https://github.com/abdulrasol/baytraq_sales_manager/releases/latest" data-goatcounter-click="download-desktop-baytraq">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
        </span>
        <span class="label"><small>Windows &amp; Linux</small><strong>Latest release</strong></span>
      </a>
    </div>

    <a class="back" href="/baytraq/">Learn more about Baytraq</a>
  </main>

  <script>
    (function () {
      var LINKS = {
        ios: "",
        android: "https://play.google.com/store/apps/details?id=io.github.abdulrasol.baytraqsalesmanager",
        desktop: "https://github.com/abdulrasol/baytraq_sales_manager/releases/latest",
        web: "/baytraq/"
      };

      function detectPlatform() {
        var ua = navigator.userAgent || '';
        if (/android/i.test(ua)) return 'android';
        if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
        // iPadOS 13+ reports itself as a Mac; a touch screen gives it away.
        if (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
        if (/macintosh/i.test(ua)) return 'ios';
        if (/windows|linux/i.test(ua)) return 'desktop';
        return 'web';
      }

      // Search engines and AI crawlers stay on the page so they read its links.
      var isBot = /bot|crawl|spider|slurp|preview|lighthouse|gptbot|claude|perplexity|bingpreview|facebookexternalhit|whatsapp\/|telegrambot/i
        .test(navigator.userAgent || '');

      var platform = detectPlatform();
      var target = LINKS[platform] || LINKS.web;

      var btn = document.getElementById('btn-' + (LINKS[platform] ? platform : 'web'));
      if (btn) btn.classList.add('primary');

      // ?stay=1 keeps the page open (handy for testing).
      var stay = /[?&]stay(=|&|$)/.test(location.search);
      var status = document.getElementById('status');

      // Unknown devices remain on this page. Known platforms go to their store.
      if (stay || isBot || platform === 'web' || !LINKS[platform]) {
        status.textContent = "Choose your platform:" + (stay ? ' (' + platform + ')' : '');
        return;
      }

      // replace() keeps this page out of history, so "Back" does not redirect again.
      location.replace(target);

      // If the browser blocks the redirect, the buttons stay as a fallback.
      setTimeout(function () { status.textContent = "Choose your platform:"; }, 2000);
    })();
  </script>
  <noscript><style>#status { display: none; }</style></noscript>

<script data-goatcounter="https://abdulrasol.goatcounter.com/count"
