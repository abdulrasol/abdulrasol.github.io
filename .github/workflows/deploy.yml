name: Build and Deploy Portfolio

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  repository_dispatch:
    types: [update-frosted-demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Frosted UI Kit for Live Demo
        uses: actions/checkout@v4
        with:
          repository: 'abdulrasol/frosted_ui_kit'
          path: '_frost_kit'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web Demo
        run: |
          cd _frost_kit/example
          flutter pub get
          flutter build web --release --base-href "/packages/frostuikit/demo/"
          mkdir -p ../../packages/frostuikit/demo
          rm -rf ../../packages/frostuikit/demo/*
          cp -R build/web/. ../../packages/frostuikit/demo/
          test -s ../../packages/frostuikit/demo/index.html
          test -s ../../packages/frostuikit/demo/flutter_bootstrap.js
          cd ../..

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build-all.py

      - name: Verify standalone Frosted UI Kit demo route
        run: |
          test -f packages/frostuikit/demo/index.html
          test -f packages/frostuikit/demo/flutter_bootstrap.js
          touch packages/frostuikit/demo/.nojekyll
          printf 'Frosted demo files: '
          find packages/frostuikit/demo -maxdepth 1 -type f | wc -l

      - name: Cleanup temporary checkout
        run: rm -rf _frost_kit

      - name: Setup Pages
        uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/master' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
